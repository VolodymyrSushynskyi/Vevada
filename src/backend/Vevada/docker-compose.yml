version: '3.8'

services:
  # 1. The Vevada .NET 8 API
  vevada-api:
    build: 
      context: . # Looks at the whole solution to grab Data and Business layers
      dockerfile: Vevada.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - JwtSettings__Key=${JWT_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__ExpireMinutes=${JWT_EXPIRE_MINUTES}
    env_file:
      - .env
    depends_on:
      - vevada-db

  # 2. PostgreSQL Database
  vevada-db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=Vevada
    env_file:
      - .env
    volumes:
      - vevada-postgres-data:/var/lib/postgresql/data

volumes:
  vevada-postgres-data: