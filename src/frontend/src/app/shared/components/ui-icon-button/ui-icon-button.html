<button
  type="button"
  [disabled]="disabled"
  class="icon-btn"
  [ngClass]="[variant, color, shape]"
  [style.width]="width"
  [style.height]="height"
  [matBadge]="badgeCount"
  [matBadgeHidden]="badgeCount === 0"
  matBadgeColor="warn"
  (click)="onClick($event)"
>
  @if (isBrowser) {
    <mat-icon [svgIcon]="icon" [style.width]="iconSize" [style.height]="iconSize"> </mat-icon>
  }
</button>
