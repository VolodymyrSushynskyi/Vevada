<div class="logo-wrapper" [ngClass]="{ 'dark-theme': theme === 'dark' }">
  <div class="text-container">
    <span class="brand-text" [style.font-size]="textSize">Vevada</span>
  </div>

  <div class="icon-anchor">
    <mat-icon
      [svgIcon]="theme === 'white' ? 'icon-white-logo' : 'icon-green-logo'"
      class="brand-icon"
      [style.width]="iconSize"
      [style.height]="iconSize"
    ></mat-icon>
  </div>
</div>
