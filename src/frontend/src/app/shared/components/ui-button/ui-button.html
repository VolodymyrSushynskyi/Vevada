<button
  [type]="type"
  [disabled]="disabled"
  class="btn text-body-1-medium"
  [ngClass]="variant"
  (click)="onClick($event)"
>
  @if (icon && iconPosition === 'left') {
    <mat-icon class="btn-icon" [svgIcon]="icon"></mat-icon>
  }

  <span class="btn-label">{{ label }}</span>

  @if (icon && iconPosition === 'right') {
    <mat-icon class="btn-icon" [svgIcon]="icon"></mat-icon>
  }
</button>
