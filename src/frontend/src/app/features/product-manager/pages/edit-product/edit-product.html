@if (productData) {
  <app-product-form
    pageTitle="Редагувати товар"
    [initialData]="productData"
    [isSubmitting]="isSubmitting"
    (formSubmit)="onFormSubmit($event)"
    (goBack)="goBack()"
  >
  </app-product-form>
} @else {
  <div class="loading-state">
    <p class="text-body-1-regular">Завантаження даних товару...</p>
  </div>
}
