<div class="orders-page-container">
  <h1 class="page-title text-h4-bold">Замовлення</h1>

  <div class="table-card">
    <table mat-table [dataSource]="displayedOrders" class="orders-table">
      <ng-container matColumnDef="orderNumber">
        <th mat-header-cell *matHeaderCellDef class="text-body-2-medium">Замовлення</th>
        <td mat-cell *matCellDef="let element" class="order-number-cell text-body-2-medium">
          №{{ element.orderNumber }}
        </td>
      </ng-container>

      <ng-container matColumnDef="itemsCount">
        <th mat-header-cell *matHeaderCellDef class="text-body-2-medium">Кількість товарів</th>
        <td mat-cell *matCellDef="let element" class="text-muted text-small-regular">
          {{ element.itemsCount }} товари
        </td>
      </ng-container>

      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef class="text-body-2-medium">Дата</th>
        <td mat-cell *matCellDef="let element" class="date-cell text-muted text-small-regular">
          <span>{{ element.createdAt | date: 'dd.MM.yyyy' }}</span
          ><br />
          <span>о {{ element.createdAt | date: 'HH:mm' }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let element" class="actions-cell">
          <div class="buttons-wrapper">
            <app-sub-button label="Подивитись деталі" (click)="viewDetails(element)">
            </app-sub-button>

            <app-main-button label="Взяти в роботу" (click)="takeInWork(element)">
            </app-main-button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator
      class="orders-paginator"
      [length]="totalRecords"
      [pageSize]="pageSize"
      [hidePageSize]="true"
      (page)="onPageChange($event)"
    >
    </mat-paginator>
  </div>
</div>
