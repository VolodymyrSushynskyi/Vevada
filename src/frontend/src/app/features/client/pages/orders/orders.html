<div class="orders-page-wrapper">
  <h1 class="page-title text-h4-bold">Мої замовлення</h1>

  <div class="orders-list">
    @for (order of mockOrders; track order.id) {
      <app-order-card
        [order]="order"
        (viewDetails)="handleViewDetails($event)"
        (cancelOrder)="handleCancelOrder($event)"
      >
      </app-order-card>
    } @empty {
      <div class="empty-state">
        <p>У вас поки немає замовлень.</p>
      </div>
    }
  </div>
</div>
