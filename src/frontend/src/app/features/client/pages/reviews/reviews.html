<div class="reviews-page-wrapper">
  <h1 class="page-title text-h3-bold">Мої коментарі</h1>

  <div class="reviews-list">
    @for (review of mockReviews; track review.id) {
      <app-profile-review-card [review]="review" (delete)="handleDelete($event)">
      </app-profile-review-card>
    } @empty {
      <div class="empty-state">У вас поки немає коментарів.</div>
    }
  </div>
</div>
