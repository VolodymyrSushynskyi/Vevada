<div class="dialog-header">
  <h2 mat-dialog-title class="text-h4-semi-bold">Залиште свій відгук</h2>
  <app-close-button class="close-btn" (close)="close()"></app-close-button>
</div>

<mat-dialog-content class="dialog-content">
  <form [formGroup]="form" class="review-form">
    <div class="rating-section">
      <app-star-rating
        [rating]="form.value.rating"
        [readonly]="false"
        size="48px"
        (ratingChange)="onRatingChange($event)"
      >
      </app-star-rating>
    </div>

    <mat-form-field appearance="outline" class="w-100 comment-field">
      <textarea matInput formControlName="comment" placeholder="Ваш коментар" rows="5"> </textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="center" class="dialog-actions">
  <div class="btn-wrapper">
    <app-main-button
      label="Залишити відгук"
      (btnClick)="onSubmit()"
      [disabled]="isSubmitting || form.invalid"
    >
    </app-main-button>
  </div>
</mat-dialog-actions>
